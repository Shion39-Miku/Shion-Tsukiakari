# Install in the existing HTTPS server, alongside the website location /.
# /chat/assets/ contains the renderer's revision-specific dependencies.
location ~ ^/(?:chat(?:/|$)|app/?$|api/chat(?:/|$)|api/admin/accounts(?:/|$)|chat-media/|desktop\.css$|chat\.webmanifest$|assets/(?:brand/tsukiakari-[0-9]+\.png|message\.wav|farewell\.webp)$) {
    proxy_pass http://127.0.0.1:4187;
    proxy_http_version 1.1;
    proxy_set_header Host shion.wiki;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
