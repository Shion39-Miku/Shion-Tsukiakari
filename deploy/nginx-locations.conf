# Add through the existing BaoTa-managed Nginx site configuration.
# Let BaoTa manage listen/ssl_certificate, ACME challenge, access and error logs.
client_max_body_size 160m;
client_body_timeout 900s;
send_timeout 900s;

location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host shion.wiki;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # BaoTa's global proxy.conf may enable a cache and strip Range upstream.
    proxy_cache off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
location = /api/public/updates {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host shion.wiki;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
}
