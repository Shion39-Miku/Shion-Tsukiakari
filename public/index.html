<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b15">
  <meta name="color-scheme" content="dark">

  <title>詩音の月光庭院</title>
  <link rel="icon" href="/assets/moonmark.svg" type="image/svg+xml">
