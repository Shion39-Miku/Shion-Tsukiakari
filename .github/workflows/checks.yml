name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已建立草稿预发布的标签，例如 v0.4.5
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          version: '11.25.0'
          runtime: 'node@24.22.3'
          install: false
      - run: pnpm security:setup --ci
      - run: pnpm security:check history
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: node desktop/node_modules/electron/install.js
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:desktop
      - run: pnpm security:check release
      - run: pnpm check:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tsukiakari-Windows
          path: |
            artifacts/Tsukiakari-*/Tsukiakari-*-Setup.exe
            artifacts/Tsukiakari-*/Tsukiakari-*-Portable.exe
          if-no-files-found: error
  android:
    if: inputs.release_tag == ''
    uses: ./.github/workflows/android.yml
  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    permissions:
      contents: write # Required to read the unpublished draft. The job never edits releases.
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ inputs.release_tag }}
  stage-release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [windows, android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Tsukiakari-Android
          path: ${{ runner.temp }}/verified-android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Tsukiakari-Windows
          path: ${{ runner.temp }}/verified-windows
      - name: Attach verified Windows files and checksums to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          release_id=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json databaseId,isDraft,isPrerelease \
            --jq 'select(.isDraft and .isPrerelease) | .databaseId')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          asset_list="repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
          stage="$RUNNER_TEMP/verified-android"
          version="${RELEASE_TAG#v}"
          apk="Tsukiakari-$version-Android.apk"
          setup="Tsukiakari-$version-Setup.exe"
          portable="Tsukiakari-$version-Portable.exe"
          shopt -s globstar nullglob
          for asset in "$setup" "$portable"; do
            candidates=("$RUNNER_TEMP"/verified-windows/**/"$asset")
            test "${#candidates[@]}" = 1
            cp -- "${candidates[0]}" "$stage/$asset"
          done
          cd "$stage"
          sha256sum "$apk" "$setup" "$portable" > SHA256SUMS.txt
          digest() { sha256sum -- "$1" | cut -d ' ' -f 1; }
          assets=$(gh api "$asset_list")
          for asset in "$apk" "$apk.sha256" android-build.json; do
            test "$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .digest' <<< "$assets")" = "sha256:$(digest "$asset")"
          done
          pending=()
          for asset in "$setup" "$portable" SHA256SUMS.txt; do
            existing=$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .digest' <<< "$assets")
            if [ -z "$existing" ]; then pending+=("$asset"); else test "$existing" = "sha256:$(digest "$asset")"; fi
          done
          if (( ${#pending[@]} )); then gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${pending[@]}"; fi
          assets=$(gh api "$asset_list")
          for asset in "$apk" "$setup" "$portable" SHA256SUMS.txt; do
            test "$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .digest' <<< "$assets")" = "sha256:$(digest "$asset")"
          done
