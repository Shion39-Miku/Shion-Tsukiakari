plugins {
    id 'com.android.application'
}

def workspace = rootProject.projectDir.parentFile
def productionOrigin = new groovy.json.JsonSlurper().parse(new File(workspace, 'deploy/chat-public.json')).origin
def publicUri = new URI(productionOrigin)
if (publicUri.scheme != 'https' || productionOrigin != "https://${publicUri.host}" ||
    !(publicUri.host ==~ /(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}/) ||
    (publicUri.host =~ /(^|\.)(example\.(com|net|org)|example|localhost|local|test|invalid)$/).find()) {
    throw new GradleException('安卓发布配置必须包含已确定的公开 HTTPS 源地址。')
}
def qaPort = Integer.parseInt(providers.environmentVariable('TSUKIAKARI_ANDROID_QA_PORT').orElse('4187').get())
if (qaPort < 1024 || qaPort > 65535) throw new GradleException('安卓联调端口无效。')

android {
    namespace 'wiki.shion.tsukiakari'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'wiki.shion.tsukiakari'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.4.3'
        buildConfigField 'String', 'CHAT_ORIGIN', "\"${productionOrigin}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            applicationIdSuffix '.qa'
            buildConfigField 'String', 'CHAT_ORIGIN', "\"http://127.0.0.1:${qaPort}\""
        }
        testRelease {
            initWith release
            applicationIdSuffix '.ci'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        assets.srcDir layout.buildDirectory.dir('generated/tsukiakari/assets')
        res.srcDir layout.buildDirectory.dir('generated/tsukiakari/res')
    }
}

def prepared = layout.buildDirectory.dir('generated/tsukiakari')
tasks.register('prepareChatAssets', Exec) {
    workingDir workspace
    commandLine 'node', 'scripts/prepare-android.mjs', prepared.get().asFile.absolutePath
    inputs.files fileTree(new File(workspace, 'public')), new File(workspace, 'content/assets/together.png'),
        new File(workspace, 'scripts/prepare-android.mjs')
    outputs.dir prepared
}
tasks.named('preBuild').configure { dependsOn 'prepareChatAssets' }
