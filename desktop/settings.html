<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'"><title>备用模型连接 · 月明かり</title><link rel="stylesheet" href="settings.css"><script src="settings.js" defer></script></head><body><main><p class="eyebrow">UNDER THE SAME MOON</p><h1>备用模型连接</h1><p class="intro">用于兼容独立模型模式。已配置 AstrBot 时优先使用服务器模型。密钥由 Windows 加密保存。</p><form id="settings"><label>接口地址<input id="api-base" type="url" autocomplete="off" required maxlength="1000" placeholder="https://api.deepseek.com/v1"></label><label>模型名称<input id="model" autocomplete="off" required maxlength="200" placeholder="deepseek-flash"></label><label>API 密钥<input id="api-key" type="password" autocomplete="new-password" maxlength="4096" placeholder="填写模型密钥"></label><p id="key-hint" class="hint"></p><p id="status" role="status" aria-live="polite"></p><button type="submit">保存并重新启动</button></form><p class="foot">仅连接模型；网站写入仍需管理员明确确认。<br>人格管理位于「软件管理 → AI 人格／角色卡」。</p></main></body></html>
